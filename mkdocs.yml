# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: AuthMS Documentation
site_description: Technical documentation for the AuthMS authentication microservice
site_url: https://amin-newcastle.github.io/authMS/

repo_name: amin-newcastle/authMS
repo_url: https://github.com/amin-newcastle/authMS
edit_uri: edit/main/docs/

theme:
  name: material

  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Architecture:
      - Overview: architecture/overview.md

  - API:
      - Reference: api/reference.md

  - Database:
      - Collections: database/collections.md

  - Development:
      - Continuous Integration: development/ci.md
      - Docker: development/docker.md
      - Testing: development/testing.md
      - Release Process: development/release-process.md

  - Security:
      - Overview: security/overview.md
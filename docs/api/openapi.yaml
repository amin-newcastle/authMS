openapi: 3.0.3
info:
  title: AuthMS API
  version: 1.0.2
  description: Authentication API for Maktab Pro.
servers:
  - url: http://localhost:5000
    description: Local Docker development
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /:
    get:
      summary: Local smoke test
      responses:
        '200':
          description: Plain text smoke-test response.
          content:
            text/html:
              schema:
                type: string
                example: Hello world!
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccess'
        '400':
          description: Invalid request body or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: User already exists
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          description: Invalid request body or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid username or password
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/verify:
    post:
      summary: Verify a JWT
      security:
        - bearerAuth: []
      responses:
        '400':
          description: Malformed JSON in an optional request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '200':
          description: Token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySuccess'
        '401':
          description: Token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  value:
                    success: false
                    message: Token is required
                invalidToken:
                  value:
                    success: false
                    message: Invalid or expired token
        '500':
          $ref: '#/components/responses/ServerError'
components:
  responses:
    ServerError:
      description: Unexpected server error with a safe message. Malformed JSON returns a validation error with HTTP 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Internal Server Error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrationInput:
      type: object
      description: Validated before the controller. Unknown properties are removed from the parsed body. String lengths count Unicode code points.
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: Trimmed before validation and storage. Length limits apply after trimming. Username must be unique and is case-sensitive.
          example: demo-user
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Preserved exactly without trimming. Must also be no more than 72 UTF-8 bytes for bcrypt; multi-byte characters can exceed that limit before reaching 72 characters.
          example: StrongPassword123
    LoginInput:
      type: object
      description: Validated before the controller. Unknown properties are removed from the parsed body. Registration length limits do not apply to existing credentials.
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          pattern: '\S'
          description: Must contain a non-whitespace character. Preserved exactly without trimming; use the stored, case-sensitive username.
          example: demo-user
        password:
          type: string
          format: password
          minLength: 1
          description: Non-empty and preserved exactly without trimming.
          example: StrongPassword123
    PublicUser:
      type: object
      required:
        - _id
        - username
      properties:
        _id:
          type: string
          example: 66b0f0000000000000000000
        username:
          type: string
          example: demo-user
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: authms
    RegisterSuccess:
      type: object
      required:
        - success
        - message
        - user
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User registered successfully
        user:
          $ref: '#/components/schemas/PublicUser'
    LoginSuccess:
      type: object
      required:
        - success
        - token
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: Signed JWT containing the user ID, issued at login with a one-hour expiry.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    VerifySuccess:
      type: object
      required:
        - success
        - decoded
      properties:
        success:
          type: boolean
          example: true
        decoded:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
          example:
            id: 66b0f0000000000000000000
            iat: 1780000000
            exp: 1780003600
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid username or password
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          enum: [Invalid request body]
        errors:
          type: array
          minItems: 1
          description: Rule failures without submitted values.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
                enum: [username, password, body]
              message:
                type: string
          example:
            - field: body
              message: Request body must be a valid JSON object
